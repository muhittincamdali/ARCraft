# XcodeGen spec for ARCraftLab.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: ARCraftLab
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
packages:
  ARCraft:
    path: ../..
targets:
  ARCraftLab:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources: [ARCraftLab]
    dependencies:
      - package: ARCraft
        product: ARCraft
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ARCraft Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Shown by visionOS before the live space starts hand and world tracking.
        INFOPLIST_KEY_NSHandsTrackingUsageDescription: ARCraft Lab follows your index fingertip and recognizes pinches to place cubes.
        INFOPLIST_KEY_NSWorldSensingUsageDescription: ARCraft Lab anchors the cubes you place to the room so they are still there next time.
        TARGETED_DEVICE_FAMILY: "1,2,7"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulators need no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  ARCraftLab:
    build:
      targets:
        ARCraftLab: all
    run:
      config: Debug
